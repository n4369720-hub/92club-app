name: Build 92 Club APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk 92club.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 92Club-APK
          path: 92club.apk
          retention-days: 30

      - name: Publish to GitHub Releases (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 92 Club App v${{ github.run_number }}
          body: |
            Auto-built APK
          files: 92club.apk
          make_latest: true
